<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Чаты | ЖКХ</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>Цифровое управление услугами ЖКХ</h1></div>
    <nav class="nav">
      <a href="index.html">🏠 Личный кабинет</a>
      <a href="charges.html">🧾 Начисления</a>
      <a href="meters.html">📟 Показания счетчиков</a>
      <a href="payments.html">💳 Платежи</a>
      <a href="requests.html">🛠 Заявки</a>
      <a href="news.html">📢 Новости</a>
      <a href="chat.html" class="active">💬 Чаты</a>
      <a href="profile.html">👤 Профиль</a>
    </nav>
    <div class="sidebar-footer">Загрузка...</div>
  </aside>

  <header class="topbar">
    <h2>Чаты с управляющей компанией</h2>
    <div class="top-actions">
      <button class="icon-btn" id="notifyBtn">🔔<span class="badge" style="display:none">0</span></button>
      <div class="profile"><div class="avatar">--</div><div><strong>...</strong><br/><span class="muted">Житель</span></div></div>
      <button class="icon-btn" data-logout title="Выйти">🚪</button>
    </div>
  </header>

  <main class="main">
    <div class="card">
      <div class="section-title"><h3>Ваши чаты</h3></div>
      <div id="list" class="muted">Загрузка...</div>
    </div>
    <div class="footer">© 2026 ЖКХ Digital</div>
  </main>
</div>

<script src="../js/api.js"></script>
<script>
if (!API.requireRole('resident')) throw new Error('stop');

document.addEventListener('DOMContentLoaded', load);

async function load() {
  try {
    const rows = await API.get('/chats');
    document.getElementById('list').innerHTML = rows.length ? rows.map(c => {
      const u = c.unread_count > 0 ? `<span class="pill orange">${c.unread_count} новых</span>` : '<span class="pill green">Нет новых</span>';
      return `<div class="chat-list-row">
        <div><strong>${escapeHtml(c.title)}</strong><div class="muted" style="margin-top:6px;font-size:13px">${escapeHtml(c.description || '')}</div></div>
        <div style="display:flex;align-items:center;gap:10px">${u}<a class="btn small" href="chat-room.html?chat=${encodeURIComponent(c.id)}">Открыть</a></div>
      </div>`;
    }).join('') : '<p class="muted">Администратор ещё не создал чаты</p>';
  } catch (e) {
    document.getElementById('list').textContent = e.message;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
